name: Multiplatform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Portable Only)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows Portable EXE (No Installer)
        run: npm run build:portable

      - name: Stage Portable Artifacts
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/RimeTune.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Portable binary not found at $exePath"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "staging-windows" | Out-Null
          Copy-Item $exePath -Destination "staging-windows/RimeTune.exe"
          Compress-Archive -Path $exePath -DestinationPath "staging-windows/RimeTune-windows-x64-portable.zip" -Force
          Get-ChildItem -Path "staging-windows"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: staging-windows/*
          if-no-files-found: error

  build-macos:
    name: 'Build macOS (Universal DMG - Intel + Apple Silicon)'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS Universal DMG
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Stage macOS Artifacts
        run: |
          mkdir -p staging-macos
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg staging-macos/
          ls -la staging-macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: staging-macos/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (Deb & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev build-essential libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux Bundles (Deb & AppImage)
        run: npm run tauri build

      - name: Stage Linux Artifacts
        run: |
          mkdir -p staging-linux
          cp src-tauri/target/release/bundle/deb/*.deb staging-linux/
          cp src-tauri/target/release/bundle/appimage/*.AppImage staging-linux/
          ls -la staging-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: staging-linux/*
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 (Deb & AppImage for Raspberry Pi)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev build-essential libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux ARM64 Bundles (Deb & AppImage)
        run: npm run tauri build

      - name: Stage Linux ARM64 Artifacts
        run: |
          mkdir -p staging-linux-arm64
          cp src-tauri/target/release/bundle/deb/*.deb staging-linux-arm64/ || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage staging-linux-arm64/ || true
          ls -la staging-linux-arm64/

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: staging-linux-arm64/*
          if-no-files-found: error

  publish-release:
    name: Publish Multiplatform Release
    needs: [build-windows, build-macos, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: release-assets
          merge-multiple: true

      - name: Inspect downloaded release assets
        run: |
          echo "=== Collected Release Assets ==="
          ls -lh release-assets/

      - name: Clean up obsolete installer assets from existing release
        run: |
          echo "Checking for existing release to remove legacy installer packages..."
          RELEASE_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")
          
          echo "$RELEASE_INFO" | jq -r '.assets[]? | select(.name | test("setup|msi"; "i")) | .id' | while read -r asset_id; do
            if [ -n "$asset_id" ]; then
              echo "Deleting obsolete asset ID: $asset_id"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$asset_id"
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'RimeTune ${{ github.ref_name }}'
          body: |
            ## 🌟 RimeTune ${{ github.ref_name }} 版本发布

            RimeTune 是一款专为 **Rime（中州韵输入法引擎）全平台（Windows 小狼毫 Weasel、macOS 鼠须管 Squirrel、Linux ibus/fcitx5-rime）** 量身打造的现代图形化配置与管理中心。

            ---

            ### 🚀 更新亮点
            - **彻底修复皮肤配置 YAML 转义缺陷 (Issue #1)**：
              - 修复皮肤方案中 `author` / `name`（如薄荷输入法 `Mintimate <"Mintimate's Blog">`）含有双引号时产生非法 YAML 导致小狼毫配置全量失效的严重问题；
              - 引入全量 YAML 字符串安全转义，并在写入磁盘前增加 YAML 语法合法性校验自检，坚决杜绝坏配置落盘；
            - **打字统计全平台支持与跨平台目录动态适配**：
              - 配合 `extras/input_stats.lua` 采集器，在仪表盘侧边栏新增「打字统计」可视化看板（支持今日、近 7 天、近 30 天统计与 12 周活跃热力图）；
              - 重构路径动态定位逻辑，彻底解决在 macOS、Linux 及自定义 Rime 用户路径下找不到数据文件的跨平台问题；
            - **新增 Linux ARM64 (树莓派 Raspberry Pi) 官方构建支持**：
              - 原生支持基于 64 位 Raspberry Pi OS、Ubuntu ARM64 等单板机环境，构建提供专用 ARM64 `.deb` 与 `.AppImage`；
            - **WeaselTune 全新升级为 RimeTune 跨平台配置中心**：从原专属 Windows 小狼毫工具正式蜕变升级为统一的 Rime 中州韵全平台配置中心；
            - **底层路径归一化重构**：消除跨系统环境下的路径解析差异，保障跨环境一致性；
            - **万象拼音 Octagram 上下文语言模型完整支持**：
              - 自动扫描并识别用户目录下所有 `*.gram` 语言模型文件（如官方 `wanxiang-lts-zh-hans.gram`），并在仪表盘呈现专属诊断卡片；
              - 零破坏挂载补丁，支持一键启用/禁用；
              - 科学调校搭配最大长度（2~8 词，推荐 5~6 词官方基准），兼顾极佳长句预测命中率与零延迟响应；
            - **Windows 11 原生侧边强调色 (`hilited_mark_color`) 与实时打字测试框**：支持候选框强调色指示条并内置实时交互打字测试区；
            - **双轨自定义短语管理 (`custom_phrase_double.txt`)**：智能识别双拼主方案（小鹤、自然码等）并优先加载双拼短语，支持全拼/双拼双轨随时切换；
            - **全局进程互斥与部署防卡死保护**：全局原子锁与 45s 超时机制，搭配全屏防重入遮罩，彻底杜绝高频点击导致的系统未响应与白屏退出；
            - **跨进程通信编码优化**：彻底消除多语言环境与终端路径乱码问题。

            ---

            ### 💻 系统与平台支持 (System Requirements)
            - **🪟 Windows**：Windows 10 / 11 (64位)
              - `RimeTune.exe` / `RimeTune-windows-x64-portable.zip`：纯绿色免安装便携版（解压即用，原生无冗余）
            - **🍎 macOS**：macOS 11 (Big Sur) 及以上（提供 Universal 通用架构 DMG，原生通吃 Apple Silicon M1/M2/M3/M4 与 Intel x86_64 处理器）
              - `.dmg`：Universal 通用架构拖拽式安装镜像
            - **🐧 Linux (x86_64 与 ARM64 树莓派)**：Ubuntu 22.04+、Debian 11/12、Raspberry Pi OS (64位)、Arch Linux、Fedora 38+、Linux Mint、Deepin / 统信 UOS 等
              - `.AppImage`：免安装便携单文件（提供 x86_64 与 aarch64 双架构）
              - `.deb`：Debian / Ubuntu / 树莓派等标准安装包（提供 amd64 与 arm64 双架构）

            ---

            ### ⚠️ 各平台安装与运行温馨提示 (Important Notes)

            #### 🍎 macOS 用户（解决“无法打开”或“已损坏”提示）：
            由于开源个人应用未购买苹果开发者证书进行付费代码公证，首次下载打开时 macOS 的 Gatekeeper 安全机制可能会拦截并提示 *“无法打开，因为无法验证开发者”* 或 *“已损坏，请移至废纸篓”*。**请放心，软件完全开源无害，只需通过以下任意一种方式解除拦截即可永久正常运行：**
            - **方法 1（图形界面放行，推荐）**：打开 Mac **「系统设置」** -> **「隐私与安全性」**，滑到最下方“安全性”一栏，点击 **「仍要打开」 (Open Anyway)** 并输入开机密码即可；
            - **方法 2（终端一行命令解除隔离）**：将应用拖入“应用程序”文件夹后，打开终端执行：
              ```bash
              sudo xattr -cr /Applications/RimeTune.app
              ```

            #### 🐧 Linux 用户（运行说明）：
            - **AppImage 用户**：下载 `.AppImage` 文件后，右键「属性」-> 勾选「允许作为程序执行文件」，或在终端执行 `chmod +x RimeTune_*.AppImage`，随后直接双击即可运行；
            - **Deb 用户**：双击安装或在终端执行 `sudo dpkg -i RimeTune_*.deb`；
            - **宿主支持**：自动检测并适配 Fcitx5-Rime 与 IBus-Rime 用户目录。
          files: |
            release-assets/*
          draft: false
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
